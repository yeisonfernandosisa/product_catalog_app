services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_catalog_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d product_catalog_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./product_catalog_backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/product_catalog_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-only-change-this-secret-before-deploying}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./product_catalog_frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
